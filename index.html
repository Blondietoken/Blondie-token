<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ... kaikki head samana ... -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .bg-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(45deg, #2a004f, #000, #2a004f);
            opacity: 0.85;
            z-index: -1;
        }

        /* NAVIGOINTI – toimii jo hyvin mobiilissa, vain pientä viilausta */
        .navbar {
            position: fixed;
            top: 0; left: 0; width: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #ff0000;
            z-index: 9999;
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem; /* hieman pienempi padding mobiilissa */
        }
        .logo { font-size: 1.6rem; }
        .hamburger { display: none; }
        .hamburger span { width: 28px; height: 3px; background: #00eaff; }

        @media (max-width: 900px) {
            .hamburger { display: flex; }
            .nav-menu {
                position: fixed;
                top: 74px; /* navbarin korkeus */
                left: -100%;
                width: 100%;
                height: calc(100vh - 74px);
                background: rgba(0, 0, 0, 0.97);
                flex-direction: column;
                justify-content: start;
                align-items: center;
                padding-top: 4rem;
                transition: left 0.4s ease;
                gap: 3rem;
            }
            .nav-menu.active { left: 0; }
            .nav-menu a { font-size: 1.6rem; }
        }

        /* PÄÄSISÄLTÖ */
        .main-content { 
            margin-top: 90px; 
            padding: 0 15px; /* tärkeä mobiilissa */
        }

        header { padding: 30px 0 10px; }
        .header-img {
            width: 90%;
            max-width: 400px;
            margin: 15px auto;
            display: block;
            box-shadow: 0 0 20px #00eaff;
            border-radius: 15px;
        }
        h1 { font-size: 2.2em; }

        /* YLEISET OSAT – nyt responsiivisia */
        .intro, #roadmap, #socials {
            margin: 50px auto;
            max-width: 900px;
            width: 100%;               /* TÄRKEÄ */
            padding: 30px 20px;        /* hyvä sisennys mobiilissa */
        }

        .intro {
            background: rgba(42,0,79,0.7);
            border-radius: 15px;
            box-shadow: 0 0 20px #ff99cc;
        }

        #roadmap, #socials {
            background: rgba(0,0,0,0.9);
            border-radius: 20px;
            box-shadow: 0 0 25px #00eaff;
            border: 2px solid #00eaff;
        }

        /* ROADMAP GRID */
        .roadmap-grid {
            display: grid;
            grid-template-columns: 1fr;                    /* mobiilissa aina 1 sarake */
            gap: 25px;
        }
        @media (min-width: 640px) {
            .roadmap-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (min-width: 1024px) {
            .roadmap-grid {
                grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            }
        }

        .roadmap-item {
            padding: 25px;
            background: #2a004f;
            border-radius: 15px;
            box-shadow: 0 0 20px #ff0000;
        }

        /* SOSIAALI-IKONIT – ei enää päällekkäin */
        .social-links {
            display: flex;
            flex-direction: column;     /* mobiilissa pystyyn */
            gap: 20px;
            width: 100%;
        }
        .social-links p {
            background: rgba(42,0,79,0.7);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 15px #ff99cc;
            font-size: 1.2em;
            margin: 0;                  /* poistaa turhia marginaaleja */
        }
        @media (min-width: 640px) {
            .social-links {
                flex-direction: row;
                flex-wrap: wrap;
            }
            .social-links p {
                flex: 1 1 300px;
                max-width: 420px;
            }
        }

        footer {
            padding: 40px 20px;
            border-top: 2px solid #ff99cc;
            background: rgba(0,0,0,0.9);
            margin-top: 80px;
        }

        /* Pienet viilaukset */
        h2 { font-size: 2em; }
        @media (min-width: 768px) { h2 { font-size: 2.2em; } }
    </style>
</head>
<body>
    <!-- Kaikki muu HTML pysyy ennallaan, mutta kääri sisältö näin: -->
    <div class="bg-overlay"></div>
    <nav class="navbar"> ... </nav>

    <div class="main-content">
        <header id="home"> ... </header>

        <section class="intro"> <!-- muutin div -> section, ei pakollinen -->
            <!-- kaikki intro-tekstit -->
        </section>

        <section id="roadmap"> ... </section>
        <section id="socials"> ... </section>

        <footer> ... </footer>
    </div>

    <!-- JS pysyy samana -->
    <script>
        const hamburger = document.getElementById('hamburger');
        const navMenu = document.getElementById('nav-menu');
        hamburger.addEventListener('click', () => {
            hamburger.classList.toggle('active');
            navMenu.classList.toggle('active');
        });
        document.querySelectorAll('.nav-menu a').forEach(link => {
            link.addEventListener('click', () => {
                hamburger.classList.remove('active');
                navMenu.classList.remove('active');
            });
        });
    </script>
</body>
</html>
