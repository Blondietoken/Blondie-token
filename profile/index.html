<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Blondie Profile • Referral Contest</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#000;color:#fff;font-family:'Orbitron',sans-serif;text-align:center;min-height:100vh}
    .bg{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(45deg,#2a004f,#000,#2a004f);opacity:0.9;z-index:-1}
    .card{background:rgba(42,0,79,0.95);max-width:500px;margin:100px auto;padding:40px;border-radius:25px;border:3px solid #00eaff;box-shadow:0 0 50px #00eaff}
    h1{font-size:3em;color:#00eaff;text-shadow:0 0 25px #00eaff;margin-bottom:30px}
    input{padding:18px;margin:15px;width:90%;background:rgba(255,255,255,0.1);border:none;border-radius:15px;color:#fff;font-size:1.3em}
    button{padding:18px;width:90%;margin:15px;background:#ff0055;border:none;border-radius:50px;color:#fff;font-size:1.5em;cursor:pointer;box-shadow:0 0 30px #ff0055;transition:.3s}
    button:hover{transform:scale(1.05);background:#ff3399}
    .reflink{background:#000;padding:25px;margin:30px 0;border-radius:20px;font-size:1.4em;color:#00eaff;border:3px dashed #ff99cc;word-break:break-all}
    .stats{font-size:2em;margin:40px 0;color:#ff99cc}
    .hidden{display:none}
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="card">
    <h1>MY PROFILE</h1>

    <div id="login">
      <input type="text" id="username" placeholder="@yourname (esim. @babe123)" required>
      <button onclick="register()">CREATE PROFILE & GET LINK</button>
    </div>

    <div id="profile" class="hidden">
      <h2>Welcome <span id="name">babe</span>!</h2>
      <p>Your referral link:</p>
      <div class="reflink" id="reflink">loading...</div>
      <button onclick="copyLink()">COPY LINK</button>
      <button onclick="shareLink()">SHARE</button>

      <div class="stats">
        Referrals: <span id="refs">0</span><br>
        Your rank: <span id="rank">#?</span>
      </div>
      <br>
      <button onclick="logout()" style="background:#880033;">Logout</button>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const ref = params.get('ref');

    function register(){
      let name = document.getElementById("username").value.trim();
      if(!name) return alert("Anna nimi!");
      if(!name.startsWith("@")) name = "@"+name;
      localStorage.setItem("blondie_user", name);
      if(ref && ref !== name){
        let c = parseInt(localStorage.getItem("refs_"+ref)||"0")+1;
        localStorage.setItem("refs_"+ref, c);
        alert("Kiitos "+ref+" – sait pisteen!");
      }
      loadProfile();
    }

    function loadProfile(){
      const user = localStorage.getItem("blondie_user");
      if(!user) return;
      document.getElementById("login").classList.add("hidden");
      document.getElementById("profile").classList.remove("hidden");
      document.getElementById("name").innerText = user;
      const link = location.origin + location.pathname + "?ref=" + encodeURIComponent(user);
      document.getElementById("reflink").innerText = link;
      document.getElementById("refs").innerText = localStorage.getItem("refs_"+user) || "0";
    }

    function copyLink(){
      navigator.clipboard.writeText(document.getElementById("reflink").innerText);
      alert("Linkki kopioitu!");
    }

    function shareLink(){
      if(navigator.share){
        navigator.share({url: document.getElementById("reflink").innerText, title:"Blondie Token Referral"});
      } else copyLink();
    }

    function logout(){
      localStorage.removeItem("blondie_user");
      location.reload();
    }

    loadProfile();
    if(ref && !localStorage.getItem("blondie_user")){
      alert("Tervetuloa Blondien maailmaan kiitos "+ref+"!");
    }
  </script>
</body>
</html>
